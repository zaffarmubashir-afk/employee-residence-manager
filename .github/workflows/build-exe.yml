name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install pyinstaller openpyxl

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "EmployeeResidenceManager" --add-data "data;data" main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeResidenceManager-windows
          path: dist/EmployeeResidenceManager.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EmployeeResidenceManager.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
