name: Build Windows EXE

# Builds EmployeeResidenceManager.exe on a real Windows runner.
# - Every push to main: builds and uploads it as a workflow artifact
#   (Actions tab -> pick the run -> Artifacts).
# - Pushing a version tag like "v1.0.0": also attaches the .exe to a
#   GitHub Release automatically.

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch: {}   # lets you click "Run workflow" manually too

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install pyinstaller openpyxl

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name "EmployeeResidenceManager" --add-data "data;data" main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmployeeResidenceManager-windows
          path: dist/EmployeeResidenceManager.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EmployeeResidenceManager.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
